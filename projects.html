---
layout: page
title: Projects
permalink: /projects/
---

<div class="project-gallery">
    {% for project in site.data.projects %}
    <div class="card">
        <img src="{{ site.baseurl }}/assets/images/{{ project.image }}" alt="{{ project.name }}">
        <h3><b>{{ project.name }}</b></h3>
        <p>{{ project.description }}</p>
        <a href="{{ project.github }}" target="_blank" rel="noopener noreferrer" class="btn">GitHub</a>
        {% if project.demo %}
        <a href="{{ project.demo }}" target="_blank" rel="noopener noreferrer" class="btn">Live Demo</a>
        {% endif %}
    </div>
    {% endfor %}
</div>
